[project]
name = "membrane"
version = "0.1.0"
description = "The embryo's membrane: the only program that runs in the brain VM"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "anthropic==1.4.0",
    "mem0ai==2.0.20",
    "openai==3.8.0",
]

[project.scripts]
membrane = "membrane.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["membrane"]
